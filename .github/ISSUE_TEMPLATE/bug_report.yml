name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! To help us fix it quickly, please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: "When I tap the practice button, the app crashes..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can we make this happen again?
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "I expected the practice screen to open..."
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform are you running on?
      options:
        - Android
        - Linux
        - Windows
        - macOS
        - Web
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App Version
      description: What version of the app are you using? (found in Settings → About or the release page)
      placeholder: "e.g., 20260523-abc123"

  - type: markdown
    attributes:
      value: |
        ## Logs

        Please attach your app logs so we can see what was happening when the bug occurred.

        ### Where to find your logs

        - **Android**: `/Android/data/com.morsetrainer.app/files/logs/` or use `adb logcat`
        - **Linux**: `~/.local/share/morse_trainer/logs/`
        - **Windows**: `%APPDATA%\morse_trainer\logs\`
        - **macOS**: `~/Library/Application Support/morse_trainer/logs/`

        The log file is named `morse_trainer.log`. If you see multiple files (e.g., `morse_trainer_2026-05-23.log`), please attach the one from the day the bug occurred.

  - type: textarea
    id: logs
    attributes:
      label: Log file contents
      description: If you can't attach the file directly, paste the relevant log lines here.
      render: text
      placeholder: "Paste log output here..."

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recordings
      description: If applicable, add screenshots or a screen recording to help explain the problem.
      placeholder: "Drag and drop images or recordings here..."

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Add any other context about the problem here.
      placeholder: "I was on a train with spotty Wi-Fi..."
