name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea! We love hearing what would make Morse Trainer better for you.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the pain point or missing capability.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
      description: A clear and concise description of what you want to happen.
      placeholder: "It would be great if the app could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Any alternatives you've considered?
      description: Describe any alternative solutions or features you've thought about.
      placeholder: "I tried using the word practice mode instead, but..."

  - type: dropdown
    id: experience
    attributes:
      label: Your experience level
      description: This helps us understand who the feature is for.
      options:
        - New to CW / Morse code
        - Some experience, learning
        - Experienced CW operator
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Add any other context, screenshots, or mockups here.
